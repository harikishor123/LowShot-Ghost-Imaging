# E2b ablation: MSE + edge only (no SSIM)
# Tests whether edge loss alone improves cell boundary preservation.
#
# Run:  python train_e2.py --config configs/e2b_mse_edge.yaml --shot-count 1000

experiment:
  name: e2b_mse_edge
  description: "E2b ablation — MSE + edge only"

data:
  frozen_root: /home/ss_students/Downloads/MTP_Ghost_Imaging/01_UNet_Baseline
  shot_count: 1000
  random_k: true
  num_workers: 2

model:
  base: 32
  depth: 3

training:
  epochs: 80
  batch_size: 16
  lr: 1.0e-4
  patience: 10
  min_delta: 1.0e-5
  seed: 0
  device: cuda

loss:
  lambda_ssim: 0.0        # disabled for this ablation
  lambda_edge: 0.05

output:
  checkpoint_dir: checkpoints
  log_dir: logs
  results_dir: results
